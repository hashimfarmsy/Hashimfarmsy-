<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة هاشم فارمسي - الأبواب والمواد</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            color: #333;
        }
        header {
            background-color: #00897b;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 20px;
        }
        .logout-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .logout-btn:hover {
            background-color: #b71c1c;
        }
        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
        }
        .search-box {
            margin-bottom: 25px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #fff;
        }
        .search-box input:focus {
            border-color: #00897b;
            outline: none;
        }
        .chapter-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border-right: 5px solid #00897b;
        }
        .chapter-section h2 {
            color: #00897b;
            margin-top: 0;
            font-size: 20px;
            border-bottom: 2px solid #e0f2f1;
            padding-bottom: 10px;
        }
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .item-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .item-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-color: #00897b;
        }
        .item-card h4 {
            color: #333;
            margin: 0 0 8px 0;
            font-size: 16px;
        }
        .item-card p {
            font-size: 13px;
            color: #666;
            margin: 0;
            line-height: 1.4;
        }
        /* النافذة المنبثقة للتفاصيل */
        #detailsModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .close-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>موسوعة هاشم فارمسي - الأبواب والمواد</h1>
        <div>
            <span id="studentName" style="margin-left: 15px; font-size: 14px;"></span>
            <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
        </div>
    </header>

    <div class="container">
        <!-- شريط البحث الفوري -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن مادة أو عنصر..." oninput="filterItems()">
        </div>

        <!-- حاوية الأبواب والمواد -->
        <div id="contentContainer">
            <p style="text-align: center; color: #666;">جاري تحميل الأبواب والمواد...</p>
        </div>
    </div>

    <!-- نافذة تفاصيل المادة المنبثقة -->
    <div id="detailsModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modalBody">
                <!-- تفاصيل المادة -->
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kjgdntatnldotuhbxqle.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_RoXSjo-ASEX-NYQzJ1t_Lw_TPQF_iwN';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let chaptersData = [];
        let itemsData = [];

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            const user = session.user;
            document.getElementById('studentName').textContent = "مرحباً: " + (user.user_metadata?.full_name || user.email);
            loadData();
        }

        async function loadData() {
            // جلب الأبواب من جدول chapters
            const { data: chapters, error: chError } = await supabase
                .from('chapters')
                .select('*')
                .order('order_index', { ascending: true });

            // جلب المواد من جدول items
            const { data: items, error: itError } = await supabase
                .from('items')
                .select('*');

            const container = document.getElementById('contentContainer');

            if (chError || itError) {
                container.innerHTML = `<p style="color: red; text-align: center;">تعسّر تحميل البيانات من الجداول.</p>`;
                return;
            }

            chaptersData = chapters || [];
            itemsData = items || [];

            renderContent(chaptersData, itemsData);
        }

        function renderContent(chapters, items) {
            const container = document.getElementById('contentContainer');
            container.innerHTML = '';

            if (chapters.length === 0) {
                container.innerHTML = `<p style="text-align: center;">لا توجد أبواب مضافة حالياً.</p>`;
                return;
            }

            chapters.forEach(chapter => {
                const chapterItems = items.filter(item => item.chapter_id === chapter.id);

                const section = document.createElement('div');
                section.className = 'chapter-section';
                
                let itemsHtml = '';
                if (chapterItems.length > 0) {
                    itemsHtml = `<div class="items-grid">`;
                    chapterItems.forEach(item => {
                        const nameAr = item.name_ar || 'مادة بدون اسم';
                        const details = item.details || 'لا توجد تفاصيل إضافية...';
                        itemsHtml += `
                            <div class="item-card" onclick='openModal(${JSON.stringify(item)})'>
                                <h4>${nameAr}</h4>
                                <p>${details.substring(0, 80)}...</p>
                            </div>
                        `;
                    });
                    itemsHtml += `</div>`;
                } else {
                    itemsHtml = `<p style="color: #888; font-size: 14px; margin-top: 10px;">لا توجد مواد مضافة تحت هذا الباب حالياً.</p>`;
                }

                section.innerHTML = `
                    <h2>${chapter.order_index ? chapter.order_index + '. ' : ''}${chapter.title_ar || chapter.title_en || 'باب رئيسي'}</h2>
                    ${itemsHtml}
                `;
                container.appendChild(section);
            });
        }

        function filterItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) {
                renderContent(chaptersData, itemsData);
                return;
            }

            const filteredItems = itemsData.filter(item => {
                const nameAr = (item.name_ar || '').toLowerCase();
                const nameEn = (item.name_en || '').toLowerCase();
                const details = (item.details || '').toLowerCase();
                return nameAr.includes(query) || nameEn.includes(query) || details.includes(query);
            });

            // تصفية الأبواب التي تحتوي على المواد المفلترة أو مطابقة للبحث
            const matchedChapterIds = new Set(filteredItems.map(i => i.chapter_id));
            const filteredChapters = chaptersData.filter(ch => 
                matchedChapterIds.has(ch.id) || (ch.title_ar || '').toLowerCase().includes(query)
            );

            renderContent(filteredChapters, filteredItems);
        }

        function openModal(item) {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <h2 style="color: #00897b; margin-top: 0;">${item.name_ar || item.name_en || 'تفاصيل المادة'}</h2>
                ${item.name_en ? `<p style="color: #666; font-style: italic;">الاسم بالإنجليزية: ${item.name_en}</p>` : ''}
                <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
                <h4 style="color: #333; margin-bottom: 5px;">التفاصيل والخصائص:</h4>
                <p style="line-height: 1.6; color: #444; white-space: pre-line;">${item.details || 'لا توجد تفاصيل مضافة.'}</p>
            `;
            document.getElementById('detailsModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }

        async function logout() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        checkAuth();
    </script>
</body>
</html>
