<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة هاشم فارمسي - المحتوى العلمي والأبواب</title>
    <!-- استدعاء مكتبة Supabase رسمياً -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            color: #333;
        }
        #auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            font-size: 24px;
            color: #111;
            margin: 10px 0 5px 0;
        }
        .subtitle {
            font-size: 13px;
            color: #00897b;
            margin-bottom: 15px;
        }
        .welcome-box {
            background-color: #e0f2f1;
            border-right: 4px solid #00897b;
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.6;
            color: #263238;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #495057;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
        }
        input:focus {
            border-color: #00897b;
            outline: none;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #00897b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #00695c;
        }

        #app-container {
            display: none;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .app-header {
            background: #00897b;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .materials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        .material-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-right: 4px solid #00897b;
        }
        .material-card h3 {
            color: #00897b;
            margin-top: 0;
            font-size: 18px;
        }
        .material-card p {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- 1. واجهة التسجيل -->
    <div id="auth-container">
        <div class="container">
            <div class="header">
                <h2>💊 هاشم فارمسي</h2>
                <div class="subtitle">Hashim Pharmacy - Science & Results</div>
            </div>

            <div class="welcome-box">
                مرحباً بك في موسوعة هاشم للمواد الخام. أدخل بياناتك للانتقال الفوري إلى المحتوى والأبواب.
            </div>

            <form id="signupForm" onsubmit="handleStudentSignup(event)">
                <div class="form-group">
                    <label>الاسم الكامل:</label>
                    <input type="text" id="fullName" placeholder="أدخل اسمك الثلاثي" required>
                </div>
                <div class="form-group">
                    <label>رقم الهاتف:</label>
                    <input type="text" id="phone" placeholder="09xxxxxxxx" required>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني:</label>
                    <input type="email" id="email" placeholder="example@domain.com" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور:</label>
                    <input type="password" id="password" placeholder="6 أحرف على الأقل" required>
                </div>
                <button type="submit" id="submitBtn" class="btn-submit">تسجيل ودخول للموسوعة</button>
            </form>
        </div>
    </div>

    <!-- 2. واجهة التطبيق وعرض الأبواب والمواد -->
    <div id="app-container">
        <div class="app-header">
            <div>
                <h2 style="margin:0;">موسوعة هاشم فارمسي - الأبواب والمواد الخام</h2>
                <span id="welcomeUser" style="font-size: 14px;">مرحباً بك</span>
            </div>
            <button onclick="logout()" style="background: #d32f2f; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer;">تسجيل خروج</button>
        </div>

        <h3 style="color: #333; margin-bottom: 15px;">قائمة الأبواب والمواد:</h3>
        <div id="materialsList" class="materials-grid">
            <p>جاري تحميل الأبواب والمواد...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kjgdntatnldotuhbxqle.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_RoXSjo-ASEX-NYQzJ1t_Lw_TPQF_iwN';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // التحقق الفوري من وجود جلسة نشطة عند فتح الصفحة
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session && session.user) {
                showApp(session.user);
            }
        }
        checkSession();

        async function handleStudentSignup(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري التسجيل وحفظ البيانات...';

            // 1. تنفيذ التسجيل في سوبابيس مع تمرير البيانات للـ Trigger
            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        full_name: fullName,
                        phone: phone,
                        password: password
                    }
                }
            });

            if (error) {
                alert("خطأ في التسجيل: " + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'تسجيل ودخول للموسوعة';
            } else {
                // 2. تسجيل الدخول البرمجي مباشرة لضمان تفعيل الجلسة
                const { data: loginData, error: loginError } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (loginError) {
                    // إذا تطلب الأمر تسجيل دخول يدوي في حال فشل التوثيق التلقائي
                    alert("تم حفظ بياناتك في الإدارة بنجاح! يرجى تسجيل الدخول.");
                    window.location.href = "login.html";
                } else {
                    // 3. الانتقال الفوري لواجهة التطبيق دون إعادة تحميل الصفحة
                    showApp(loginData.user);
                }
            }
        }

        // دالة عرض التطبيق وجلب الأبواب من جدول materials
        async function showApp(user) {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
            document.getElementById('welcomeUser').textContent = "مرحباً بك، " + (user.user_metadata?.full_name || user.email);

            // جلب البيانات من جدول materials في سوبابيس
            const { data: materials, error } = await supabase
                .from('materials')
                .select('*');

            const container = document.getElementById('materialsList');
            container.innerHTML = '';

            if (error) {
                container.innerHTML = `<p style="color: red;">تعسّر تحميل الأبواب، تأكد من جدول materials في سوبابيس.</p>`;
                console.error(error);
                return;
            }

            if (!materials || materials.length === 0) {
                container.innerHTML = `<p>لا توجد مواد مضافة في القائمة حالياً.</p>`;
                return;
            }

            materials.forEach(item => {
                const card = document.createElement('div');
                card.className = 'material-card';
                card.innerHTML = `
                    <h3>${item.title || item.name || 'باب علمي'}</h3>
                    <p>${item.description || item.content || 'التفاصيل والخصائص العلمية...'}</p>
                `;
                container.appendChild(card);
            });
        }

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }
    </script>
</body>
</html>
