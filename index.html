<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل مواد التركيبات التجميلية</title>
<style>
:root{--bg:#faf6f2;--card:#fff;--tx:#2a2220;--mu:#7a6b66;--ac:#b4536a;--ac2:#f6e3e8;--bd:#eadfd8;--ok:#2f7d4f;--no:#b3392f;--wn:#a86a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1618;--card:#2a2124;--tx:#f3e9e6;--mu:#b6a39e;--ac:#e58aa0;--ac2:#3d2830;--bd:#41343a;--ok:#6fcf97;--no:#ff8a80;--wn:#f0c05a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1618;--card:#2a2124;--tx:#f3e9e6;--mu:#b6a39e;--ac:#e58aa0;--ac2:#3d2830;--bd:#41343a;--ok:#6fcf97;--no:#ff8a80;--wn:#f0c05a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.7}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:6px 0 2px}
.sub{color:var(--mu);font-size:.9rem;margin:0 0 14px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin-bottom:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 10px;text-align:center;font:inherit;color:var(--tx);cursor:pointer}
.b:active{background:var(--ac2)}
.b .i{font-size:1.6rem;display:block}
.b small{display:block;color:var(--mu);font-size:.75rem}
.l{display:flex;flex-direction:column;gap:8px}
.l .b{text-align:right;display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.bk{background:none;border:none;color:var(--ac);font:inherit;cursor:pointer;padding:6px 0;margin-bottom:6px}
.cv a{color:var(--ac)}
.cs{display:flex;flex-direction:column;gap:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;border-inline-start:5px solid var(--ac)}
.c.ok{border-inline-start-color:var(--ok)}.c.no{border-inline-start-color:var(--no)}.c.wn{border-inline-start-color:var(--wn)}
.cl{color:var(--ac);font-weight:700;font-size:.85rem;margin-bottom:6px}
.c.ok .cl{color:var(--ok)}.c.no .cl{color:var(--no)}.c.wn .cl{color:var(--wn)}
.cv{font-size:1rem;line-height:1.95;word-break:break-word}
.cv a{display:block;padding:4px 0}
.en{direction:ltr;text-align:left;color:var(--mu);font-size:.95rem}
.pf{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:16px}
.ph{width:84px;height:84px;aspect-ratio:1/1;object-fit:cover;border-radius:14px;flex:none;border:2px solid var(--ac2)}
.ini{display:flex;align-items:center;justify-content:center;background:var(--ac2);color:var(--ac);font-size:2rem;font-weight:700}
.pf h2{margin:0;font-size:1.1rem}
.pf p{margin:2px 0 8px;color:var(--mu);font-size:.85rem}
.pf a{display:inline-block;margin-inline-end:6px;padding:4px 12px;border-radius:20px;background:var(--ac2);color:var(--ac);text-decoration:none;font-size:.85rem}
.ft{color:var(--mu);font-size:.75rem;margin-top:16px;text-align:center}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
/* عدّل بياناتك هنا */
const ME={name:"هاشم فارمسي",intro:"أهلاً بك 🌿 مرجعك المنظّم لمواد التركيبات التجميلية. لكل مادة اسمها بالعربي والإنجليزي، وتعريفها الكامل، ونسبة استخدامها، وما يتوافق معها وما يتعارض، مع مراجعها العلمية لتبني تركيبتك بثقة.",phone:"0998607719",photo:"photo.jpg"};
const S=[
{n:"المستحلبات",e:"Emulsifiers",i:"🧴",m:[
["سيتيريل الكحول","Cetearyl Alcohol","كحول دهني (خليط سيتيل وستيريل) يُستخدم كمكثّف ومثبّت للمستحلب ويعطي ملمساً كريمياً ناعماً.","مكثّف / مثبّت مستحلب","2–5%","غير مؤثر","مستحلبات (بوليسوربات 60، سيتيريث-20)، الزيوت، الزبدات","لا يتوافق مع شيء بشكل خاص، لكن النسبة العالية تعطي ملمساً ثقيلاً وشمعياً","يُذاب مع الطور الزيتي بالتسخين"],
["بوليسوربات 80","Polysorbate 80","مستحلب غير أيوني (HLB ≈ 15) يُكوّن مستحلب زيت في ماء ويُذيب الزيوت العطرية والزيوت الخفيفة.","مستحلب زيت/ماء، مذيب","1–5%","3–9","الزيوت، الكحولات الدهنية، سبان 80 (للتوازن)","قد يقلّل فعالية بعض المواد الحافظة مثل البارابين، ولا يحب الأحماض القوية والإلكتروليتات العالية","لزج، يُضاف للطور الزيتي أو يُمزج مع الزيت أولاً"],
["جليسريل ستيرات","Glyceryl Stearate","إستر من الجليسرين وحمض الستياريك، مستحلب ومكثّف لطيف وأصله غالباً نباتي.","مستحلب مساعد / مكثّف","2–5%","5–8","سيتيريل الكحول، حمض الستياريك، الزيوت، الزبدات","ضعيف وحده؛ يحتاج غالباً مستحلباً مساعداً. ويتأثر بالأحماض القوية","الصيغة SE (Self-Emulsifying) تحتوي على صابون بوتاسيوم وتتحسس من الأحماض"]]},
{n:"المرطّبات",e:"Humectants",i:"💧",m:[
["الجلسرين","Glycerin","كحول متعدد الهيدروكسيل يسحب الماء ويحبسه في الجلد، من أكثر المرطبات استخداماً وأماناً.","مرطّب","2–10%","3–10","تقريباً كل المواد: هيالورونيك، نياسيناميد، بانثينول","فوق 10% يعطي إحساساً لزجاً، وفي الجو الجاف جداً قد يسحب ماء من طبقات الجلد العميقة","يُضاف في الطور المائي، ويُستخدم لتفريق الصمغ (زانثان) قبل إضافته للماء"],
["حمض الهيالورونيك","Hyaluronic Acid (Sodium Hyaluronate)","متعدد سكريات يحمل ماءً يعادل مئات أضعاف وزنه، يرطّب سطح الجلد ويعطي ملمساً ناعماً.","مرطّب / مكوّن للفيلم","0.1–1%","4–8","جلسرين، نياسيناميد، بانثينول، فيتامين C","pH أقل من 3.5 أو الحرارة العالية يكسّرانه، والإلكتروليتات العالية تقلل اللزوجة","يُنقع ببطء في الماء حتى ينتفخ لتفادي التكتل"],
["البانثينول","Panthenol (Provitamin B5)","مُقدِّم فيتامين B5 يتحول في الجلد إلى حمض البانتوثينيك، يرطّب ويهدّئ ويساعد ترميم الحاجز الجلدي.","مرطّب / مهدّئ","1–5%","4–6","هيالورونيك، نياسيناميد، سيراميد، الأحماض الخفيفة","يتحلل في pH أقل من 3 أو أكثر من 8 وفي الحرارة العالية","يُضاف في الطور البارد (تحت 40 مئوية)"]]},
{n:"الزيوت والزبدات",e:"Oils & Butters",i:"🌰",m:[
["زبدة الشيا","Shea Butter","دهن نباتي مستخلص من ثمار الشيا، غني بالأحماض الدهنية والمواد غير القابلة للتصبن، مطرّ ومرمّم قوي.","ملطّف / مرطّب سطحي","2–10% (حتى 100% في البلسم)","غير مؤثر","الزيوت، الشموع، الزبدات الأخرى، السيتيريل الكحول","لا يذوب في الماء ويحتاج مستحلباً، وقد يتحبب (grainy) إذا بُرّد ببطء","يُذاب بالتسخين ثم يُبرّد بسرعة"],
["زيت الجوجوبا","Jojoba Oil","شمع سائل (وليس زيتاً تقنياً) قريب من زهم الجلد، ثابت جداً ضد الأكسدة وخفيف الملمس.","ملطّف / ناقل","1–10% (ويصلح نقياً)","غير مؤثر","كل الزيوت والمواد الدهنية والفيتامينات الذائبة في الزيت","لا يذوب في الماء ولا يتحمل الإضافة المباشرة للطور المائي بدون مستحلب","ثبات عالٍ ويطوّل عمر التركيبة"],
["زيت جوز الهند","Coconut Oil","زيت نباتي غني بحمض اللوريك، يتجمد قرب 24 مئوية ويعطي حماية سطحية.","ملطّف / مكوّن للصابون","2–15%","غير مؤثر","زبدة الشيا، الشموع، زيت الجوجوبا","قد يسد المسام (comedogenic) للوجه، ويتجمد في الجو البارد فيؤثر على القوام","يُفضّل المكرر للوجه"]]},
{n:"المواد الفعّالة",e:"Actives",i:"✨",m:[
["نياسيناميد","Niacinamide (Vitamin B3)","شكل من فيتامين B3 يقلل مظهر المسام والبقع ويعزز حاجز الجلد ويضبط الدهون.","فعّال / منظم الزهم","2–5% (أكثر نطاق مدعوم بدراسات سريرية؛ تقييم CIR غطّى مستويات استخدام حتى 3% وقت إصداره)","5–7","هيالورونيك، بانثينول، زنك، ريتينول، وبقية الفعّالات (لا تعارضات موثقة)","لا تعارضات موثقة مع الفعّالات الأخرى. نظرياً قد يتحلل لحمض النيكوتينيك (احمرار) في وسط شديد الحموضة أو القلوية مع حرارة","ثابت نسبياً، تجنّب التسخين الزائد مع pH متطرف"],
["فيتامين سي","Vitamin C (L-Ascorbic Acid)","مضاد أكسدة قوي يفتّح البقع ويحفّز الكولاجين ويحمي من التأكسد الضوئي.","مضاد أكسدة / مفتّح","5–20%","أقل من 3.5","فيتامين E، حمض الفيروليك، هيالورونيك","شديد عدم الثبات مع الهواء والضوء والماء والحديد والنحاس؛ لا يُستخدم مع الريتينول في نفس الوقت","يُعبّأ في عبوة معتمة محكمة ويُضاف في آخر التحضير"],
["ريتينول","Retinol (Vitamin A)","مشتق فيتامين A يسرّع تجدد الخلايا ويقلل التجاعيد وحب الشباب.","فعّال مضاد للشيخوخة","حتى 0.3% مكافئ ريتينول لمنتجات البقاء على الجلد، وحتى 0.05% لمستحضرات الجسم (الحدود القانونية الأوروبية)","5–6","هيالورونيك، نياسيناميد، سيراميد، ببتيدات","يتحلل بالضوء والهواء، ويُتجنب جمعه مع مقشّرات قوية (AHA/BHA) وبنزويل بيروكسايد لزيادة التهيج، ويُتجنب أثناء الحمل بإرشاد طبي","عبوة معتمة وأنبوب مضغوط، ويُستخدم ليلاً مع واقي شمس نهاراً"],
["حمض الساليسيليك","Salicylic Acid (BHA)","حمض يذوب في الزيت ويخترق المسام ويقشّر الطبقة السطحية، فعال لحب الشباب والرؤوس السوداء.","مقشّر / مضاد حب الشباب","حتى 2% لمنتجات البقاء على الجلد (0.5% في مستحضر الجسم والماسكارا وظلال العيون والروج والرول-أون)، وحتى 3% لمنتجات الشعر التي تُشطف، و0.5% كحافظ","3–4","نياسيناميد، هيالورونيك، زنك","لا يُستخدم للأطفال تحت 3 سنوات (ما عدا الشامبو)، ويهيّج العين بشدة، ويُتجنب في الحمل، ولا يُجمع مع الريتينول أو أحماض قوية أخرى","يُذاب أولاً في الكحول أو البروبيلين جلايكول"]]},
{n:"المواد الحافظة",e:"Preservatives",i:"🛡️",m:[
["فينوكسي إيثانول","Phenoxyethanol","مادة حافظة واسعة الطيف تعمل ضد البكتيريا والفطريات، وتستخدم كثيراً في الكريمات والسيرومات.","حافظ","حتى 1.0% (الحد الأقصى القانوني، الملحق V رقم 29)","3–10","إيثيل هكسيل جلسرين، الغليكولات","لا تتجاوز 1%؛ لم نوثّق تعارضات محددة","أضفه في الطور البارد وتحقق من فعالية الحفظ (challenge test)"],
["سوربات البوتاسيوم","Potassium Sorbate","ملح بوتاسيوم لحمض السوربيك، فعال أكثر ضد الفطريات والخمائر.","حافظ","حتى 0.6% محسوباً كحمض السوربيك (الملحق V رقم 4)","أقل من 6","بنزوات الصوديوم، مواد حافظة أخرى","يفقد فعاليته عند pH فوق 6","يُذاب في الماء ويُضاف للطور المائي"]]},
{n:"المكثّفات",e:"Thickeners",i:"🌀",m:[
["صمغ الزانثان","Xanthan Gum","بوليمر سكري ينتجه التخمر، يكثّف الطور المائي ويثبّت المستحلبات ويتحمل نطاق pH واسع.","مكثّف / مثبّت","0.2–1%","3–12","الجلسرين، معظم المواد المائية","يتكتل إذا أضيف جافاً للماء، وقد يعطي ملمساً لزجاً عند النسبة العالية","يُفرَّق بالجلسرين أو الزيت أولاً ثم يُضاف للماء"],
["الكاربومر","Carbomer","بوليمر أكريليك يتكثف بعد المعادلة ويكوّن جل شفاف ومستقر.","مكثّف / مكوّن للجل","0.2–1%","5.5–7 بعد التعديل","التراي إيثانول أمين، هيدروكسيد الصوديوم، جلسرين","يفقد لزوجته مع الإلكتروليتات العالية والأحماض القوية والمواد الموجبة الشحنة","يُنثر ببطء على الماء ويُعدَّل pH لإظهار اللزوجة"]]},
{n:"مضادات الأكسدة",e:"Antioxidants",i:"🍃",m:[
["فيتامين هـ","Tocopherol (Vitamin E)","مضاد أكسدة ذائب في الزيت يحمي الزيوت من التزنخ ويدعم الحماية من أضرار الأشعة.","مضاد أكسدة","0.1–1%","غير مؤثر","فيتامين C، حمض الفيروليك، الزيوت","لا يتوافق مع شيء بشكل خاص، والنسبة العالية قد تعطي ملمساً دهنياً","يُضاف في الطور الزيتي أو البارد"]]}
];
const G=[["قاعدة CIR لسلامة مكونات التجميل (ابحث بالاسم)","https://www.cir-safety.org/ingredients"],["اللائحة الأوروبية 1223/2009","https://eur-lex.europa.eu/eli/reg/2009/1223/oj"]];
const REF={
"Niacinamide":[["CIR, Int J Toxicol 2005;24(Suppl 5):1–31","https://pubmed.ncbi.nlm.nih.gov/16596767/"],["Gehring W., J Cosmet Dermatol 2004;3(2):88–93","https://doi.org/10.1111/j.1473-2130.2004.00115.x"]],
"Retinol":[["SCCS/1639/21 (2022): رأي اللجنة العلمية الأوروبية عن فيتامين A","https://health.ec.europa.eu/publications/revision-scientific-opinion-sccs157616-vitamin-retinol-retinyl-acetate-retinyl-palmitate_en"],["اللائحة (EU) 2024/996: الحدود القانونية","https://eur-lex.europa.eu/eli/reg/2024/996/oj"]],
"Salicylic Acid":[["اللائحة (EU) 2019/1966 ورأي SCCS لسنة 2018","https://www.legislation.gov.uk/eur/2019/1966/data.html"],["ملخص القيود المحدّثة (Omnibus III، اللائحة 2021/850)","https://coslaw.eu/watchout/salicylicacid/"]],
"Phenoxyethanol":[["اللائحة 1223/2009، نص الملحق V (رقم 29)","https://legislation.gov.uk/eur/2009/1223/annex/V/division/2/data.html"]],
"Potassium Sorbate":[["اللائحة 1223/2009، نص الملحق V (رقم 4)","https://legislation.gov.uk/eur/2009/1223/annex/V/division/2/data.html"]]
};
const R=[["الاسم بالإنجليزي",1],["التعريف الكامل",2],["الوظيفة",3],["نسبة الاستخدام المعتادة",4],["نطاق pH المناسب",5],["يشتغل مع ✅",6],["ما يشتغل مع ❌ / تنبيهات",7],["ملاحظات التحضير",8]];
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function home(){
 const wa=ME.phone.replace(/\D/g,'').replace(/^0/,'249');
 app.innerHTML=`<div class="pf"><img class="ph" src="${ME.photo}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph ini',textContent:ME.name.trim()[0]}))"><div><h2>${ME.name}</h2><p>${ME.intro}</p><a href="tel:${ME.phone.replace(/\s/g,'')}">📞 ${ME.phone}</a><a href="https://wa.me/${wa}">واتساب</a></div></div>
 <h1>🧪 دليل مواد التركيبات التجميلية</h1><p class="sub">اختار القسم، ثم المادة لتشوف جدول المعلومات الكامل</p>
 <input id="q" placeholder="🔍 ابحث عن مادة بالعربي أو الإنجليزي"><div id="res"></div>
 <div class="g" id="gr">${S.map((s,i)=>`<button class="b" data-s="${i}"><span class="i">${s.i}</span>${s.n}<small>${s.e} · ${s.m.length}</small></button>`).join('')}</div>
 <p class="ft">المراجع الأساسية: لائحة مستحضرات التجميل الأوروبية 1223/2009 (الملحقان III وV)، آراء اللجنة العلمية SCCS، وتقارير CIR. حالة التوثيق ومصادر كل مادة داخل جدولها.</p>`;
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>sec(+b.dataset.s));
 document.getElementById('q').oninput=e=>{
  const v=e.target.value.trim().toLowerCase(),r=document.getElementById('res'),g=document.getElementById('gr');
  if(!v){r.innerHTML='';g.style.display='';return}
  g.style.display='none';let h='';
  S.forEach((s,si)=>s.m.forEach((m,mi)=>{if((m[0]+m[1]).toLowerCase().includes(v))h+=`<button class="b" data-s="${si}" data-m="${mi}"><span>${m[0]}</span><small class="en">${m[1]}</small></button>`}));
  r.innerHTML=`<div class="l">${h||'<p class="sub">ما لقينا نتيجة</p>'}</div>`;
  r.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>mat(+b.dataset.s,+b.dataset.m));
 };
}
function sec(i){
 const s=S[i];
 app.innerHTML=`<button class="bk" id="bk">→ رجوع للأقسام</button><h1>${s.i} ${s.n}</h1><p class="sub">${s.e}</p>
 <div class="l">${s.m.map((m,j)=>`<button class="b" data-m="${j}"><span>${m[0]}<small class="en">${m[1]}</small></span><span>‹</span></button>`).join('')}</div>`;
 document.getElementById('bk').onclick=home;
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>mat(i,+b.dataset.m));
 scrollTo(0,0);
}
function mat(i,j){
 const m=S[i].m[j];
 const key=Object.keys(REF).find(k=>m[1].startsWith(k)),v=key?REF[key]:null,refs=(v||[]).concat(G);
