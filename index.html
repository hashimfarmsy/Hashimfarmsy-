<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة هاشم فارمسي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            color: #333;
        }
        header {
            background-color: #00897b;
            color: white;
            padding: 15px 25px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .search-box {
            margin-bottom: 25px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #fff;
        }
        .section-title {
            color: #00897b;
            border-bottom: 2px solid #00897b;
            padding-bottom: 5px;
            margin-top: 30px;
            font-size: 18px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .card h3 {
            margin: 0 0 8px 0;
            color: #333;
            font-size: 16px;
        }
        .card p {
            font-size: 13px;
            color: #666;
            margin: 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <h1>موسوعة هاشم فارمسي للمواد والتجميل</h1>
    </header>

    <div class="container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث في المواد الخام والأبواب الدراسية..." oninput="filterData()">
        </div>

        <div class="section-title">🧪 المواد الخام (Raw Materials)</div>
        <div id="rawMaterialsContainer" class="grid">
            <p style="color: #666;">جاري تحميل المواد الخام...</p>
        </div>

        <div class="section-title">📚 الأبواب والمواد الدراسية</div>
        <div id="chaptersContainer" style="margin-top: 15px;">
            <p style="color: #666;">جاري تحميل الأبواب...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kjgdntatnldotuhbxqle.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_RoXSjo-ASEX-NYQzJ1t_Lw_TPQF_iwN';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let globalRaw = [];
        let globalChapters = [];
        let globalItems = [];

        async function loadData() {
            try {
                const { data: raw, error: rawErr } = await supabase.from('raw_materials').select('*');
                const { data: chapters, error: chErr } = await supabase.from('chapters').select('*');
                const { data: items, error: itmErr } = await supabase.from('items').select('*');

                globalRaw = raw || [];
                globalChapters = chapters || [];
                globalItems = items || [];

                render(globalRaw, globalChapters, globalItems);
            } catch (err) {
                console.error("خطأ في الاتصال:", err);
            }
        }

        function render(raw, chapters, items) {
            const rawContainer = document.getElementById('rawMaterialsContainer');
            if (!raw || raw.length === 0) {
                rawContainer.innerHTML = `<p style="color:#888;">لا توجد مواد خام مضافة حالياً.</p>`;
            } else {
                rawContainer.innerHTML = raw.map(r => `
                    <div class="card">
                        <h3>${r.name || r.title || 'بدون اسم'}</h3>
                        <p>${r.description || r.details || 'لا توجد تفاصيل'}</p>
                    </div>
                `).join('');
            }

            const chaptersContainer = document.getElementById('chaptersContainer');
            if (!chapters || chapters.length === 0) {
                chaptersContainer.innerHTML = `<p style="color:#888;">لا توجد أبواب مضافة حالياً.</p>`;
                return;
            }

            chaptersContainer.innerHTML = chapters.map(ch => {
                const chItems = items.filter(i => i.chapter_id === ch.id);
                const itemsHtml = chItems.length > 0 ? 
                    `<div class="grid" style="margin-top:10px;">` + 
                    chItems.map(i => `
                        <div class="card" style="background:#f8f9fa;">
                            <h3>${i.name_ar || i.name_en || i.name || 'مادة'}</h3>
                            <p>${i.details || i.description ? (i.details || i.description) : 'لا توجد تفاصيل'}</p>
                        </div>
                    `).join('') + `</div>` 
                    : `<p style="font-size:13px; color:#888;">لا توجد مواد تحت هذا الباب.</p>`;

                return `
                    <div style="background:white; padding:15px; border-radius:8px; margin-bottom:15px; border-right:4px solid #00897b; box-shadow: 0 2px 5px rgba(0,0,0,0.03);">
                        <h3 style="color:#00897b; margin-top:0;">${ch.title_ar || ch.title_en || ch.name || 'باب'}</h3>
                        ${itemsHtml}
                    </div>
                `;
            }).join('');
        }

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) {
                render(globalRaw, globalChapters, globalItems);
                return;
            }

            const filteredRaw = globalRaw.filter(r => (r.name || '').toLowerCase().includes(query) || (r.description || '').toLowerCase().includes(query));
            const filteredItems = globalItems.filter(i => (i.name_ar || '').toLowerCase().includes(query) || (i.details || '').toLowerCase().includes(query));
            const matchedIds = new Set(filteredItems.map(i => i.chapter_id));
            const filteredChapters = globalChapters.filter(ch => matchedIds.has(ch.id) || (ch.title_ar || '').toLowerCase().includes(query));

            render(filteredRaw, filteredChapters, filteredItems);
        }

        loadData();
    </script>
</body>
</html>
