<script>
    // ربط سوبابيس (إذا لم يكن مربوطاً مسبقاً)
    const SUPABASE_URL = 'https://kjgdntatnldotuhbxqle.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_RoXSjo-ASEX-NYQzJ1t_Lw_TPQF_iwN';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // دالة جلب المواد وعرضها في التصميم الأصلي
    async function loadMaterials() {
        const { data: materials, error } = await supabase
            .from('materials')
            .select('*');

        const container = document.getElementById('materialsList');
        if (!container) return;

        container.innerHTML = '';

        if (error) {
            console.error("خطأ:", error.message);
            return;
        }

        if (materials && materials.length > 0) {
            materials.forEach(item => {
                const card = document.createElement('div');
                card.innerHTML = `<h3>${item.title || item.name}</h3><p>${item.description || item.content || ''}</p>`;
                container.appendChild(card);
            });
        }
    }

    window.addEventListener('DOMContentLoaded', loadMaterials);
</script>
