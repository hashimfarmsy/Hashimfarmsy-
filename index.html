<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فحص خطوة بخطوة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: Tahoma; padding: 20px;">
    <h2>🔍 خطوة 1: فحص جدول المواد الخام</h2>
    <div id="result" style="padding: 15px; background: #eee; border-radius: 5px;">جاري الفحص...</div>

    <script>
        const SUPABASE_URL = 'https://kjgdntatnldotuhbxqle.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_RoXSjo-ASEX-NYQzJ1t_Lw_TPQF_iwN';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function testStep1() {
            const resDiv = document.getElementById('result');
            try {
                const { data, error } = await supabase.from('raw_materials').select('*');
                
                if (error) {
                    resDiv.innerHTML = `<span style="color:red;">❌ خطأ من سوبابيس: ${error.message}</span>`;
                } else if (!data || data.length === 0) {
                    resDiv.innerHTML = `<span style="color:orange;">⚠️ الجدول متصل ولكن لم يتم العثور على بيانات (فارغ).</span>`;
                } else {
                    resDiv.innerHTML = `<span style="color:green;">✅ النجاح! تم جلب (${data.length}) عنصر بنجاح. أول مادة هي: ${data[0].name}</span>`;
                }
            } catch (err) {
                resDiv.innerHTML = `<span style="color:red;">❌ خطأ برمجي: ${err.message}</span>`;
            }
        }

        testStep1();
    </script>
</body>
</html>
