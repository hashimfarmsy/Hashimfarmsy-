<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل طالب جديد - موسوعة هاشم للمواد الخام</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #1ebe5d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>إنشاء حساب جديد</h2>
        <form id="signupForm">
            <div class="form-group">
                <label for="fullName">الاسم الكامل:</label>
                <input type="text" id="fullName" required placeholder="أدخل اسمك الكامل">
            </div>

            <div class="form-group">
                <label for="phone">رقم الهاتف:</label>
                <input type="tel" id="phone" required placeholder="09xxxxxxxx">
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني:</label>
                <input type="email" id="email" required placeholder="example@domain.com">
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" required placeholder="********">
            </div>

            <button type="submit">إتمام التسجيل وإرسال إثبات الدفع</button>
        </form>
    </div>

    <!-- ربط مكتبة Supabase -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // بيانات مشروع Supabase
        const SUPABASE_URL = 'https://kjgdntatnldotuhbxqle.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_RoXSjo-ASEX-NYQzJ1t_Lw_TPQF_iwN';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('signupForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // 1. تسجيل المستخدم في Supabase Auth
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName,
                            phone: phone
                        }
                    }
                });

                if (error) throw error;

                alert('تم إنشاء الحساب بنجاح! سيتم تحويلك الآن إلى الواتساب لإرسال إثبات الدفع.');

                // 2. التوجيه إلى رقم واتساب الخاص بك
                const whatsappMessage = encodeURIComponent(`مرحباً يا هندسة هاشم، لقد قمت بالتسجيل في الموسوعة باسم: ${fullName} ورقمي: ${phone} وهذا بريدي: ${email}. أرفق لك إثبات الدفع لتفعيل حسابي.`);
                window.location.href = `https://wa.me/249998607716?text=${whatsappMessage}`;

            } catch (error) {
                alert('حدث خطأ أثناء التسجيل: ' + error.message);
                console.error(error);
            }
        });
    </script>
</body>
</html>
